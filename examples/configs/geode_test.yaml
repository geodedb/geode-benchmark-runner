db:
  host: 127.0.0.1
  port: 3141
  transport: quic_tls_insecure
  timeout_ms: 30000

scenario:
  network_mode: loopback
  durability: fsync
  consistency: serializable
  cache_state: warm
  db_version: 0.18.0

workload:
  benchpack: gdc_micro_primitives
  mode: closed_loop
  duration_sec: 10
  workers: 2
  in_flight_per_worker: 5
  slo_ms: 100
  violation_threshold: 0.05
  error_threshold: 0.0

dataset:
  dataset_id: tiny_snb
  workdir: work/
  auto_load: false
  skip_load: false

loader:
  type: quic_gql_batch
  batch_size: 100
  insert_node_template: "CREATE (n:{{label}} {id: '{{id}}'}) RETURN n"
  insert_edge_template: "MATCH (a {id: '{{src}}'}), (b {id: '{{dst}}'}) CREATE (a)-[:{{type}}]->(b)"
